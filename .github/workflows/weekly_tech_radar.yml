name: Weekly Tech Radar Auto-Scout

on:
  schedule:
    # Chạy vào 00:00 UTC mỗi sáng Thứ Hai (tương đương 07:00 sáng Thứ Hai giờ Việt Nam)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Cho phép bấm nút kích hoạt thủ công trên GitHub

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tech Radar AI Scout
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python scripts/update_tech_radar.py

      - name: Commit and push changes if updated
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Elite-Radar-Bot"
          git add data/tech_radar.json
          if git diff --staged --quiet; then
            echo "Không có dữ liệu mới để commit."
          else
            git commit -m "chore(radar): tự động cập nhật Top 10 mã nguồn mở tuần mới [skip ci]"
            git push
          fi
